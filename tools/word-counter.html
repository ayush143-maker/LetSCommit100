<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter</title><style>body{max-width:680px;margin:40px auto;padding:0 18px;background:#111;color:#f3f0e8;font:16px/1.5 system-ui}textarea{width:100%;min-height:240px;box-sizing:border-box;padding:14px;border:1px solid #444;border-radius:10px;background:#1b1b1b;color:inherit;font:inherit}section{display:flex;gap:20px;flex-wrap:wrap}strong{font-size:1.5rem}p{color:#aaa69e}</style></head><body><h1>Word Counter</h1><p>Paste or write text below. Counts update as you type.</p><textarea id="text" placeholder="Start writing…" aria-label="Text to count"></textarea><section><p><strong id="words">0</strong><br>Words</p><p><strong id="chars">0</strong><br>Characters</p><p><strong id="noSpace">0</strong><br>Without spaces</p><p><strong id="lines">0</strong><br>Lines</p></section><script>const field=document.querySelector('#text');function update(){const value=field.value;document.querySelector('#words').textContent=(value.trim().match(/\S+/g)||[]).length;document.querySelector('#chars').textContent=value.length;document.querySelector('#noSpace').textContent=value.replace(/\s/g,'').length;document.querySelector('#lines').textContent=value.length?value.split(/\r\n|\r|\n/).length:0}field.addEventListener('input',update);update();</script></body></html>
