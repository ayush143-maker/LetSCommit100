<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Length converter</title><style>body{font:16px system-ui;max-width:600px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input,select{padding:10px;margin:6px 0}output{display:block;font-size:1.4rem;font-weight:700;margin-top:12px}</style><h1>Length converter</h1><label>Value <input id="v" type="number" value="1"></label><p><select id="a"><option value="1">Metres</option><option value=".01">Centimetres</option><option value=".001">Millimetres</option><option value="1000">Kilometres</option><option value=".0254">Inches</option><option value=".3048">Feet</option><option value="0.9144">Yards</option><option value="1609.344">Miles</option></select> to <select id="b"><option value="1">Metres</option><option value=".01">Centimetres</option><option value=".001">Millimetres</option><option value="1000">Kilometres</option><option value=".0254">Inches</option><option value=".3048">Feet</option><option value="0.9144">Yards</option><option value="1609.344">Miles</option></select></p><output id="o"></output><script>function calc(){o.textContent=(Number(v.value)*Number(a.value)/Number(b.value)).toLocaleString(undefined,{maximumFractionDigits:8})}document.querySelectorAll('input,select').forEach(x=>x.oninput=x.onchange=calc);calc();</script></html>
