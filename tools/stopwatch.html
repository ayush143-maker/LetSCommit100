<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stopwatch</title><style>body{font:16px system-ui;text-align:center;max-width:600px;margin:40px auto;padding:0 16px;background:#f8f7f3;color:#181818}output{display:block;font-size:3rem;font-variant-numeric:tabular-nums;margin:24px}button{padding:10px 14px;margin:4px}ol{display:inline-block;text-align:left}</style><h1>Stopwatch</h1><output id="o">00:00.0</output><button id="start">Start</button><button id="lap">Lap</button><button id="reset">Reset</button><ol id="laps"></ol><script>let elapsed=0,startAt=0,run=false,frame;function draw(){let ms=elapsed+(run?performance.now()-startAt:0),tenths=Math.floor(ms/100),mins=Math.floor(tenths/600),secs=Math.floor(tenths/10)%60;o.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')+'.'+tenths%10;if(run)frame=requestAnimationFrame(draw)}start.onclick=()=>{if(run){elapsed+=performance.now()-startAt;run=false;cancelAnimationFrame(frame);start.textContent='Start';draw()}else{startAt=performance.now();run=true;start.textContent='Pause';draw()}};lap.onclick=()=>{if(run){let li=document.createElement('li');li.textContent=o.textContent;laps.prepend(li)}};reset.onclick=()=>{run=false;cancelAnimationFrame(frame);elapsed=0;start.textContent='Start';laps.replaceChildren();draw()};</script></html>
