<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 text tool</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}textarea{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:8px}button{padding:10px}</style><h1>Base64 text tool</h1><p>Encode or decode UTF-8 text locally.</p><textarea id="i" rows="6" placeholder="Text or Base64"></textarea><p><button id="e">Encode ↓</button> <button id="d">Decode ↑</button></p><textarea id="o" rows="6" placeholder="Result"></textarea><output id="s" aria-live="polite"></output><script>const i=document.querySelector('#i'),o=document.querySelector('#o'),s=document.querySelector('#s');e.onclick=()=>{try{o.value=btoa(unescape(encodeURIComponent(i.value)));s.textContent='Encoded'}catch{s.textContent='Could not encode input'}};d.onclick=()=>{try{o.value=decodeURIComponent(escape(atob(i.value.trim())));s.textContent='Decoded'}catch{s.textContent='Invalid Base64 or unsupported text'}};</script></html>
