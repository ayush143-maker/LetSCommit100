<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number base converter</title><style>body{font:16px system-ui;max-width:650px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input,select{padding:10px;margin:8px 0}output{display:block;margin:12px 0;font-family:monospace;overflow-wrap:anywhere}</style><h1>Number base converter</h1><label>Input base <select id="base"><option value="2">Binary (2)</option><option value="8">Octal (8)</option><option value="10" selected>Decimal (10)</option><option value="16">Hexadecimal (16)</option></select></label><input id="n" placeholder="Enter an integer" value="255"><p>Binary</p><output id="b2"></output><p>Octal</p><output id="b8"></output><p>Decimal</p><output id="b10"></output><p>Hexadecimal</p><output id="b16"></output><script>function go(){let s=n.value.trim(),v=parseInt(s,Number(base.value)),valid=s!==''&&Number.isSafeInteger(v)&&v.toString(Number(base.value)).toLowerCase()===s.toLowerCase().replace(/^\+/,'');for(let [id,b] of [['b2',2],['b8',8],['b10',10],['b16',16]])document.getElementById(id).textContent=valid?v.toString(b).toUpperCase():'Enter a valid safe integer for the selected base.'}n.oninput=base.onchange=go;go();</script></html>
