<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character reference</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}button{font:inherit;padding:12px;margin:5px;border:1px solid #bbb;border-radius:8px;background:white;min-width:58px}output{display:block;margin-top:18px;font-size:1.2rem}</style><h1>Character reference</h1><p>Tap a symbol to copy it.</p><section id="grid"></section><output id="o" aria-live="polite"></output><script>const chars=['—','–','…','“','”','‘','’','©','®','™','→','←','↑','↓','↔','✓','✕','•','·','°','×','÷','≤','≥','≠','±','∞','√','π','₹','€','£','¥','§','¶','※'];for(const c of chars){let b=document.createElement('button');b.textContent=c;b.title='Copy '+c;b.onclick=async()=>{try{await navigator.clipboard.writeText(c);o.textContent='Copied '+c}catch{o.textContent='Selected symbol: '+c}};grid.append(b)}</script></html>
