<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Note</title><style>body{max-width:560px;margin:40px auto;padding:0 18px;background:#111;color:#f3f0e8;font:16px/1.5 system-ui}section{display:grid;gap:14px;padding:20px;border:1px solid #444;border-radius:12px;background:#1b1b1b}input,button{font:inherit;padding:10px;border:1px solid #444;border-radius:8px;background:#222;color:inherit}input[type=color]{width:100%;height:90px;padding:4px}#swatch{height:150px;border-radius:10px;background:#e7e2d8}output{font:1.5rem ui-monospace,monospace}</style></head><body><h1>Color Note</h1><p>Choose a color and copy its hex code.</p><section><div id="swatch" aria-label="Color preview"></div><label for="picker">Choose color</label><input id="picker" type="color" value="#e7e2d8"><output id="hex">#E7E2D8</output><button id="copy" type="button">Copy hex</button><p id="status" role="status" aria-live="polite"></p></section><script>const picker=document.querySelector('#picker'),swatch=document.querySelector('#swatch'),hex=document.querySelector('#hex'),status=document.querySelector('#status');function update(){swatch.style.background=picker.value;hex.value=picker.value.toUpperCase();hex.textContent=hex.value}picker.addEventListener('input',update);document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(hex.value);status.textContent='Copied '+hex.value}catch{status.textContent='Copy is unavailable here; select the code above.'}});update();</script></body></html>
