<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus timer</title><style>body{font:16px system-ui;text-align:center;max-width:550px;margin:40px auto;padding:0 16px;background:#f8f7f3;color:#181818}output{display:block;font-size:4rem;font-variant-numeric:tabular-nums;margin:28px}button{padding:10px 14px;margin:4px}input{padding:8px;width:70px}</style><h1>Focus session</h1><p>Choose a duration in minutes.</p><input id="m" type="number" min="1" max="180" value="25"><output id="o">25:00</output><button id="start">Start</button><button id="pause">Pause</button><button id="reset">Reset</button><p id="s" aria-live="polite">Ready when you are.</p><script>let left=1500,end=0,tick=null;const o=document.querySelector('#o'),m=document.querySelector('#m'),s=document.querySelector('#s');function draw(){left=Math.max(0,left);o.textContent=Math.floor(left/60).toString().padStart(2,'0')+':'+(left%60).toString().padStart(2,'0');if(!left){clearInterval(tick);tick=null;s.textContent='Session complete. Take a short break.'}}function pause(){if(tick){clearInterval(tick);tick=null;left=Math.max(0,Math.ceil((end-Date.now())/1000));draw();s.textContent='Paused.'}}m.onchange=()=>{pause();left=Math.max(1,Math.min(180,+m.value||25))*60;draw()};start.onclick=()=>{if(!tick&&left>0){end=Date.now()+left*1000;tick=setInterval(()=>{left=Math.max(0,Math.ceil((end-Date.now())/1000));draw()},250);s.textContent='Focus time.'}};document.querySelector('#pause').onclick=pause;document.querySelector('#reset').onclick=()=>{pause();left=Math.max(1,Math.min(180,+m.value||25))*60;draw();s.textContent='Ready when you are.'};draw();</script></html>
