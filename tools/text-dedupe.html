<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remove duplicate lines</title><style>body{font:16px system-ui;max-width:750px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}textarea{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:8px}button{padding:10px}</style><h1>Remove duplicate lines</h1><label><input id="ignore" type="checkbox"> Ignore case</label><textarea id="i" rows="8" placeholder="Paste lines here…"></textarea><button id="go">Remove duplicates</button><button id="copy">Copy result</button><textarea id="o" rows="8" placeholder="Unique lines in original order"></textarea><output id="s"></output><script>go.onclick=()=>{let lines=i.value.split(/\r?\n/),seen=new Set(),out=[];for(let line of lines){let key=ignore.checked?line.toLowerCase():line;if(!seen.has(key)){seen.add(key);out.push(line)}}o.value=out.join('\n');s.textContent=(lines.length-out.length)+' duplicate line(s) removed.'};copy.onclick=async()=>{try{await navigator.clipboard.writeText(o.value);s.textContent='Copied.'}catch{s.textContent='Select the result and copy it.'}};</script></html>
