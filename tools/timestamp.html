<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix timestamp converter</title><style>body{font:16px system-ui;max-width:650px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0}output{display:block;overflow-wrap:anywhere;font-weight:700;margin:8px 0}</style><h1>Unix timestamp converter</h1><p>Convert seconds since 1970-01-01 UTC to a date, or a date to seconds.</p><label>Unix timestamp (seconds)<input id="t" type="number" placeholder="1793140000"></label><output id="date"></output><hr><label>Date and time<input id="d" type="datetime-local"></label><output id="ts"></output><script>t.oninput=()=>{let n=Number(t.value),v=new Date(n*1000);date.textContent=t.value&&Number.isFinite(n)&&Number.isFinite(v.getTime())?v.toISOString():'Enter a valid timestamp.'};d.oninput=()=>{let n=Date.parse(d.value);ts.textContent=d.value&&Number.isFinite(n)?Math.floor(n/1000)+' seconds':'Choose a date and time.'};</script></html>
