<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slug maker</title><style>body{font:16px system-ui;max-width:650px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px;margin:8px 0}output{overflow-wrap:anywhere;font-weight:700}</style><h1>URL slug maker</h1><label>Page title<input id="i" placeholder="A Practical Guide to Small Projects"></label><p>Slug</p><output id="o">a-practical-guide-to-small-projects</output><script>function go(){o.textContent=i.value.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}i.oninput=go;</script></html>
