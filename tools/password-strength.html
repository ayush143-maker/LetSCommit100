<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password strength guide</title><style>body{font:16px system-ui;max-width:650px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px}li{margin:6px 0}</style><h1>Password strength guide</h1><p>Checks happen locally in this page. Do not paste a real password you currently use.</p><input id="i" type="password" autocomplete="off" placeholder="Use a made-up example"><p id="r" aria-live="polite">Enter an example to see guidance.</p><ul id="l"></ul><script>const i=document.querySelector('#i'),r=document.querySelector('#r'),l=document.querySelector('#l');i.oninput=()=>{let s=i.value,checks=[['At least 14 characters',s.length>=14],['Mix of upper and lowercase',/[a-z]/.test(s)&&/[A-Z]/.test(s)],['Includes digits or symbols',/[0-9\W_]/.test(s)],['Not a common predictable pattern',!/^(password|123456|qwerty)/i.test(s)]];r.textContent=s.length===0?'Enter an example to see guidance.':checks.filter(x=>x[1]).length+'/4 guidance checks met';l.replaceChildren(...checks.map(([t,ok])=>{let x=document.createElement('li');x.textContent=(ok?'✓ ':'○ ')+t;return x}))};</script></html>
