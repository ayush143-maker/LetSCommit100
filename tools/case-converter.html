<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text case converter</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px}button{padding:9px 12px;margin:6px 4px 6px 0}</style><h1>Text case converter</h1><textarea id="t" rows="8" placeholder="Type or paste text"></textarea><p><button data-mode="upper">UPPERCASE</button><button data-mode="lower">lowercase</button><button data-mode="title">Title Case</button><button data-mode="sentence">Sentence case</button><button id="copy">Copy</button></p><script>const t=document.querySelector('#t');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{let s=t.value,m=b.dataset.mode;t.value=m==='upper'?s.toUpperCase():m==='lower'?s.toLowerCase():m==='title'?s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()):s.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,c=>c.toUpperCase())});document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(t.value)}catch{t.select();document.execCommand('copy')}};</script></html>
