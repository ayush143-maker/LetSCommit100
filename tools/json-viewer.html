<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON formatter</title><style>body{font:16px system-ui;max-width:800px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px;font:14px monospace}button{padding:10px}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}</style><h1>JSON formatter</h1><textarea id="i" rows="9" placeholder='{"hello":"world"}'></textarea><p><button id="f">Format</button> <button id="m">Minify</button></p><output id="o" aria-live="polite"></output><script>const i=document.querySelector('#i'),o=document.querySelector('#o');function run(min){try{let v=JSON.parse(i.value);o.textContent=JSON.stringify(v,null,min?0:2);o.style.color='inherit'}catch(e){o.textContent='Invalid JSON: '+e.message;o.style.color='#b42318'}}f.onclick=()=>run(false);m.onclick=()=>run(true);</script></html>
