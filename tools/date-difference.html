<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date difference</title><style>body{font:16px system-ui;max-width:600px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input{padding:10px;margin:8px 0 18px;display:block}output{font-weight:700;font-size:1.4rem}</style><h1>Date difference</h1><label>Start date<input id="a" type="date"></label><label>End date<input id="b" type="date"></label><output id="o">Choose both dates.</output><script>const a=document.querySelector('#a'),b=document.querySelector('#b'),o=document.querySelector('#o');function calc(){if(!a.value||!b.value){o.textContent='Choose both dates.';return}let x=Date.parse(a.value+'T00:00:00Z'),y=Date.parse(b.value+'T00:00:00Z'),d=Math.round(Math.abs(y-x)/86400000);o.textContent=d+' day'+(d===1?'':'s')+(y<x?' (end date is earlier)':'')}a.onchange=b.onchange=calc;</script></html>
