<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random choice picker</title><style>body{font:16px system-ui;max-width:650px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px}button{padding:10px 14px}output{display:block;font-size:1.5rem;font-weight:700;margin-top:20px}</style><h1>Random choice picker</h1><p>Enter one option per line.</p><textarea id="i" rows="8" placeholder="Read a chapter&#10;Take a walk&#10;Tidy desk"></textarea><p><button id="go">Pick one</button></p><output id="o" aria-live="polite"></output><script>go.onclick=()=>{let a=i.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);o.textContent=a.length?a[Math.floor(Math.random()*a.length)]:'Add at least one option first.'};</script></html>
