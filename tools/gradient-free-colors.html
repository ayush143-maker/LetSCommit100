<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrast checker</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}label{display:inline-block;margin:10px 16px 10px 0}input{display:block;margin-top:6px;width:70px;height:42px}#sample{padding:24px;margin-top:18px;border:1px solid #aaa;border-radius:8px}output{font-weight:700}</style><h1>Accessible contrast checker</h1><label>Text color<input id="fg" type="color" value="#171717"></label><label>Background<input id="bg" type="color" value="#ffffff"></label><section id="sample"><strong>Sample text</strong><p>Readable text matters for everyone.</p></section><p>Contrast ratio: <output id="ratio"></output></p><p id="grade"></p><script>function lum(hex){let a=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*a[0]+.7152*a[1]+.0722*a[2]}function go(){sample.style.color=fg.value;sample.style.background=bg.value;let x=lum(fg.value),y=lum(bg.value),r=(Math.max(x,y)+.05)/(Math.min(x,y)+.05);ratio.textContent=r.toFixed(2)+':1';grade.textContent=r>=7?'Passes WCAG AAA for normal text.':r>=4.5?'Passes WCAG AA for normal text.':r>=3?'May pass AA for large text only.':'Low contrast: choose different colors.'}fg.oninput=bg.oninput=go;go();</script></html>
