<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill split</title><style>body{font:16px system-ui;max-width:600px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}label{display:block;margin:14px 0}input{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #aaa;border-radius:8px;margin-top:5px}output{font-size:1.5rem;font-weight:700}</style><h1>Bill split calculator</h1><label>Bill amount<input id="b" type="number" min="0" value="1200"></label><label>Tip (%)<input id="t" type="number" min="0" value="10"></label><label>People<input id="p" type="number" min="1" step="1" value="3"></label><p>Total: <output id="total"></output></p><p>Each person: <output id="each"></output></p><script>function calc(){let b=Math.max(0,+document.querySelector('#b').value||0),t=Math.max(0,+document.querySelector('#t').value||0),p=Math.max(1,Math.floor(+document.querySelector('#p').value||1)),fmt=n=>n.toLocaleString(undefined,{style:'currency',currency:'INR'});total.textContent=fmt(b*(1+t/100));each.textContent=fmt(b*(1+t/100)/p)}document.querySelectorAll('input').forEach(x=>x.oninput=calc);calc();</script></html>
