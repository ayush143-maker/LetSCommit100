<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Checklist</title><style>body{max-width:620px;margin:40px auto;padding:0 18px;font:16px/1.5 system-ui;background:#111;color:#f3f0e8}input,button{font:inherit;padding:10px;border:1px solid #444;border-radius:8px;background:#222;color:inherit}form{display:flex;gap:8px}form input{flex:1;min-width:0}li{padding:10px 0}li label{overflow-wrap:anywhere}li button{float:right;padding:3px 8px}#items{padding-left:22px}</style></head><body><h1>Checklist</h1><p>Keep the next small steps visible.</p><form id="form"><input id="task" maxlength="120" placeholder="Add a task" required><button>Add</button></form><ul id="items"></ul><button id="clear" type="button">Clear completed</button><script>const key='lc-checklist';let items=JSON.parse(localStorage.getItem(key)||'[]');const list=document.querySelector('#items');function save(){localStorage.setItem(key,JSON.stringify(items));render()}function render(){list.replaceChildren();items.forEach((item,i)=>{const li=document.createElement('li'),label=document.createElement('label'),check=document.createElement('input'),text=document.createTextNode(' '+item.text),del=document.createElement('button');check.type='checkbox';check.checked=item.done;check.addEventListener('change',()=>{items[i].done=check.checked;save()});label.append(check,text);del.textContent='×';del.setAttribute('aria-label','Delete '+item.text);del.addEventListener('click',()=>{items.splice(i,1);save()});li.append(label,del);list.append(li)})}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();items.push({text:document.querySelector('#task').value.trim(),done:false});e.target.reset();save()});document.querySelector('#clear').addEventListener('click',()=>{items=items.filter(x=>!x.done);save()});render();</script></body></html>
