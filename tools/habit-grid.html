<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven-day habit grid</title><style>body{font:16px system-ui;max-width:650px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input{padding:10px;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #ccc;text-align:left}input[type=checkbox]{width:20px;height:20px}</style><h1>Seven-day habit grid</h1><label>Habit name<input id="name" value="Read for 20 minutes"></label><table><thead><tr><th>Day</th><th>Done</th></tr></thead><tbody id="rows"></tbody></table><p id="count"></p><script>const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],rows=document.querySelector('#rows');days.forEach((d,i)=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+d+'</td><td><input type="checkbox" aria-label="'+d+' complete"></td>';rows.append(tr)});function calc(){let n=rows.querySelectorAll('input:checked').length;count.textContent=n+' of 7 days checked';try{localStorage.habitGrid=JSON.stringify({name:name.value,days:[...rows.querySelectorAll('input')].map(x=>x.checked)})}catch{}}try{let v=JSON.parse(localStorage.habitGrid||'null');if(v){name.value=v.name;rows.querySelectorAll('input').forEach((x,i)=>x.checked=!!v.days[i])}}catch{}name.oninput=calc;rows.onchange=calc;calc();</script></html>
