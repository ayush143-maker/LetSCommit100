<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage calculator</title><style>body{font:16px system-ui;max-width:600px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input{padding:12px;width:100%;box-sizing:border-box;margin:6px 0 16px;border:1px solid #aaa;border-radius:8px}output{font-size:1.5rem;font-weight:700}</style><h1>Percentage calculator</h1><label>What percentage? <input id="p" type="number" value="15"></label><label>Of what number? <input id="n" type="number" value="240"></label><p>Result: <output id="o">36</output></p><script>function calc(){o.textContent=(Number(p.value)*Number(n.value)/100).toLocaleString(undefined,{maximumFractionDigits:8})}p.oninput=calc;n.oninput=calc;</script></html>
