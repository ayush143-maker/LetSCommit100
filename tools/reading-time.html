<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading time</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}textarea,input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #bbb;border-radius:8px}output{font-size:1.4rem;font-weight:700}</style><h1>Reading time</h1><p>Estimate how long a passage may take to read.</p><label>Reading speed (words/min)<input id="speed" type="number" min="50" max="1000" value="220"></label><textarea id="text" rows="10" placeholder="Paste text here…"></textarea><p><output id="result">0 min</output></p><script>function update(){let n=(document.querySelector('#text').value.trim().match(/\S+/g)||[]).length,s=Math.max(1,+document.querySelector('#speed').value||220),m=n/s;document.querySelector('#result').textContent=n+' words · '+(m<1?Math.max(1,Math.ceil(m*60))+' sec':Math.ceil(m)+' min')}document.querySelectorAll('textarea,input').forEach(x=>x.addEventListener('input',update));</script></html>
