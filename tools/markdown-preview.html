<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown quick preview</title><style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}textarea,article{box-sizing:border-box;width:100%;min-height:300px;padding:12px;border:1px solid #aaa;border-radius:8px;background:white;overflow-wrap:anywhere}textarea{font:14px monospace}@media(max-width:650px){main{grid-template-columns:1fr}}</style><h1>Markdown quick preview</h1><p>Supports headings, bold, italic, inline code, and plain paragraphs. Preview text is escaped before rendering.</p><main><textarea id="i" placeholder="# Heading&#10;&#10;Write **bold** text here."></textarea><article id="o"></article></main><script>const i=document.querySelector('#i'),o=document.querySelector('#o');function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){let s=esc(i.value).split('\n').map(line=>{if(line.startsWith('### '))return '<h3>'+line.slice(4)+'</h3>';if(line.startsWith('## '))return '<h2>'+line.slice(3)+'</h2>';if(line.startsWith('# '))return '<h1>'+line.slice(2)+'</h1>';return line}).join('\n');s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');o.innerHTML='<p>'+s+'</p>'}i.oninput=render;render();</script></html>
