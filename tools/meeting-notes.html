<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting notes pad</title><style>body{font:16px system-ui;max-width:750px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #aaa;border-radius:8px}textarea{min-height:280px}button{padding:10px}</style><h1>Meeting notes pad</h1><p>Draft notes are saved in this browser on this device.</p><input id="title" placeholder="Meeting title"><textarea id="notes" placeholder="Agenda, decisions, action items…"></textarea><button id="download">Download .txt</button><button id="clear">Clear notes</button><output id="s" aria-live="polite"></output><script>const title=document.querySelector('#title'),notes=document.querySelector('#notes'),s=document.querySelector('#s');try{title.value=localStorage.meetingTitle||'';notes.value=localStorage.meetingNotes||''}catch{}function save(){try{localStorage.meetingTitle=title.value;localStorage.meetingNotes=notes.value;s.textContent='Saved locally.'}catch{s.textContent='Browser storage is unavailable; download a backup.'}}title.oninput=notes.oninput=save;download.onclick=()=>{let a=document.createElement('a'),blob=new Blob([title.value+'\n\n'+notes.value],{type:'text/plain'});a.href=URL.createObjectURL(blob);a.download=(title.value||'meeting-notes').replace(/[^a-z0-9-_]/gi,'-')+'.txt';a.click();URL.revokeObjectURL(a.href)};clear.onclick=()=>{if(confirm('Clear these notes from this browser?')){title.value='';notes.value='';save()}};</script></html>
