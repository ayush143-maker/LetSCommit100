<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL parts viewer</title><style>body{font:16px system-ui;max-width:700px;margin:32px auto;padding:0 16px;background:#f8f7f3;color:#181818}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px}dl{display:grid;grid-template-columns:130px 1fr;gap:10px}dd{margin:0;overflow-wrap:anywhere}</style><h1>URL parts viewer</h1><input id="i" placeholder="https://example.com/path?topic=web#top"><dl id="o"></dl><script>const i=document.querySelector('#i'),o=document.querySelector('#o');function go(){o.replaceChildren();try{let u=new URL(i.value);for(let [k,v] of Object.entries({Origin:u.origin,Protocol:u.protocol,Host:u.host,Pathname:u.pathname,Query:u.search||'—',Hash:u.hash||'—'})){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;o.append(dt,dd)}}catch{let d=document.createElement('dd');d.textContent=i.value?'Enter a valid absolute URL.':'';o.append(d)}}i.oninput=go;</script></html>
